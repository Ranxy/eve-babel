appId: com.evebabel.app
productName: EVE-Babel
directories:
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources
    to: resources
    filter:
      - "*.dat"
      - "*.json"
asar: true
artifactName: ${productName}-${version}-${arch}.${ext}
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true